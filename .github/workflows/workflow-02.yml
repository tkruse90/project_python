name: Test with uv

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Sync dependencies
        run: uv sync --locked

      - name: Generate import test
        run: |
          if [ -x .github/workflows/REGX_test_import_libraries.sh ]; then
            ./.github/workflows/REGX_test_import_libraries.sh
          elif [ -x .github/workflows/REGX_test_import_libraries_w_python.sh ]; then
            ./.github/workflows/REGX_test_import_libraries_w_python.sh
          fi

      - name: Run import test
        run: |
          if [ -f .github/workflows/testing/test_import_libraries.py ]; then
            uv run --with pytest pytest .github/workflows/testing/test_import_libraries.py -q
          else
            echo "No generated import test found."
          fi
